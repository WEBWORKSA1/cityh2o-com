name: Daily water news refresh

on:
  schedule:
    - cron: "17 10 * * *"   # every day at 10:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/news.json"]

permissions:
  contents: write

concurrency:
  group: news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds and rebuild data/news.json
        run: python3 scripts/update_news.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No changes"; exit 0
          fi
          git config user.name "cityh2o-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore(news): daily refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
